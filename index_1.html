<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M9 9h4v14H9zM19 9h4v14h-4zM13 14h6v4h-6z' fill='white'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== Connexion ===== -->
<section id="login" class="login hidden">
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="logo">H</div>
    <h1>Hub</h1>
    <p class="muted">Connexion avec ton compte Supabase</p>
    <input id="email" type="email" placeholder="Email" autocomplete="username" required>
    <input id="pass" type="password" placeholder="Mot de passe" autocomplete="current-password" required>
    <button type="submit" class="btn primary" id="loginBtn">Se connecter</button>
    <p id="loginMsg" class="msg"></p>
  </form>
</section>

<!-- ===== Chargement / refus ===== -->
<section id="splash" class="splash"><div class="spinner"></div></section>
<section id="denied" class="splash hidden">
  <div class="login-card">
    <h1>Accès réservé</h1>
    <p class="muted">Ce compte n'a pas accès au hub.</p>
    <button class="btn" data-action="logout">Se déconnecter</button>
  </div>
</section>

<!-- ===== Application ===== -->
<div id="app" class="hidden">
  <header class="top">
    <div class="brand"><span class="logo sm">H</span>Hub</div>
    <div class="top-right">
      <span id="syncInfo" class="muted small"></span>
      <button class="icon-btn" data-action="theme" title="Mode clair / sombre" aria-label="Mode clair / sombre"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="icon-btn" data-action="logout" title="Se déconnecter" aria-label="Se déconnecter"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </header>

  <main class="layout">
    <div class="col-main">
      <div id="kpis" class="kpis"></div>
      <div id="wipWarn" class="warn hidden"></div>
      <section id="recap" class="recap"></section>

      <section class="block">
        <div class="block-head"><h2>Maintenant</h2></div>
        <ul id="now" class="now-list"></ul>
      </section>

      <section class="block">
        <div class="block-head">
          <h2>Projets</h2>
          <button class="btn sm" data-action="new-project">＋ Projet</button>
        </div>
        <div id="filters" class="chips"></div>
        <div id="projects"></div>
      </section>
    </div>

    <aside class="col-side">
      <section class="block">
        <div class="block-head"><h2>Idées</h2><span id="ideaCount" class="muted small"></span></div>
        <form id="ideaForm" class="inline-form">
          <input id="ideaInput" placeholder="Une idée ? Note-la ici…" maxlength="200">
          <button class="btn sm primary" type="submit">＋</button>
        </form>
        <ul id="ideas" class="ideas"></ul>
      </section>

      <section class="block">
        <div class="block-head"><h2>Note rapide</h2></div>
        <form id="noteForm" class="note-form">
          <select id="noteProject"></select>
          <textarea id="noteText" rows="2" placeholder="Ex. : appel avec Hani, devis reçu" maxlength="500"></textarea>
          <button class="btn sm primary" type="submit">Ajouter au journal</button>
        </form>
      </section>

      <section class="block">
        <div class="block-head"><h2>Plateformes</h2></div>
        <div id="platforms" class="platforms"></div>
      </section>

      <section class="block">
        <details id="journalBox">
          <summary><h2>Journal</h2><span class="muted small">30 dernières entrées</span></summary>
          <ul id="journal" class="journal"></ul>
        </details>
      </section>
    </aside>
  </main>
</div>

<!-- ===== Fenêtre d'édition ===== -->
<dialog id="editor" class="editor">
  <form id="editForm" method="dialog">
    <h2 id="editTitle">Projet</h2>
    <label>Nom<input name="name" required maxlength="80"></label>
    <div class="grid2">
      <label>Catégorie
        <select name="category">
          <option value="dev">Dev / Web</option><option value="pro">Pro</option>
          <option value="immo">Immo / Admin</option><option value="creatif">Créatif</option>
          <option value="perso">Perso</option>
        </select>
      </label>
      <label>Statut
        <select name="status">
          <option value="actif">Actif</option><option value="bloque">Bloqué</option>
          <option value="pause">En pause</option><option value="termine">Terminé</option>
        </select>
      </label>
    </div>
    <div class="grid2">
      <label>Échéance<input name="deadline" type="date"></label>
      <label class="check"><input name="urgent" type="checkbox"> Urgent</label>
    </div>
    <label>Prochaine étape<input name="next_step" maxlength="200"></label>
    <label>Ce qui bloque<input name="blocker" maxlength="200"></label>
    <label>Résumé<textarea name="summary" rows="2" maxlength="500"></textarea></label>
    <label>Liens <span class="muted small">(un par ligne : Nom | https://…)</span><textarea name="links" rows="3"></textarea></label>
    <label>Repo GitHub <span class="muted small">(propriétaire/nom, pour le suivi auto des commits)</span><input name="repo" maxlength="120"></label>
    <p id="editMsg" class="msg"></p>
    <div class="editor-actions">
      <button type="button" class="btn" data-action="close-editor">Annuler</button>
      <button type="submit" class="btn primary" value="save">Enregistrer</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
